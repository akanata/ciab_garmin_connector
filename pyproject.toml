[project]
name = "garmin-health"
version = "0.1.0"
description = "Serves Garmin Connect health data over the Cloud in a Bottle health-data service"
requires-python = "==3.12.*"
dependencies = [
    "litestar>=2.24",
    "hypercorn>=0.18",
    # >=24.1: FunctionDispatch takes_converter, relied on by the spec's converter.
    "attrs>=24.1",
    "cattrs>=24.1",
    "GarminDb==3.9.0",
    # Imported directly by providers/garmindb/auth.py, so it is declared rather
    # than relied on as a transitive of GarminDb. Pinned to what GarminDb 3.9.0
    # resolves to, because three 0.3.11 contracts are load-bearing and documented
    # in AGENTS.md: return_on_mfa is a CONSTRUCTOR argument, login() never dumps
    # the token in that mode, and resume_login ignores its client_state.
    "garminconnect==0.3.11",
    "health-data-service @ git+https://github.com/cloud-in-a-bottle/health-data-service-spec@main",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_health"]

[tool.pytest.ini_options]
addopts = "-v"
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Ruff formats Python code blocks inside Markdown. plan.md and AGENTS.md are the
# design of record, not source; reformatting their snippets is pure noise.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "B",       # flake8-bugbear
    "UP",      # pyupgrade (modern Python syntax)
    "I",       # isort
    "PLC0415", # import-outside-top-level
    "TID251",  # banned-api: the provider boundary, below
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
known-first-party = ["garmin_health"]

# The provider boundary, enforced at lint time. Everything crossing it is a
# health_data_service type, a ports type, or a stdlib type -- never a database
# handle, a session, or a vendor client.
#
# This table is GLOBAL, so it cannot express the reverse rule (that nothing under
# providers/ may import the app). tests/test_boundary.py walks the import graph
# for that half, and cross-checks this table so the two cannot drift apart.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"garmindb".msg = "Only garmin_health.providers.garmindb may import GarminDB (AGENTS.md: isolation rule)."
"garminconnect".msg = "Only garmin_health.providers.garmindb may import garminconnect."
"idbutils".msg = "Only garmin_health.providers.garmindb may import idbutils."
"fitfile".msg = "Only garmin_health.providers.garmindb may import fitfile."
"garth".msg = "Only garmin_health.providers.garmindb may import garth."
"sqlalchemy".msg = "Only garmin_health.providers.garmindb may import SQLAlchemy; the core reads through ports.HealthReader."
"garmin_health.providers.garmindb".msg = "The core must not name a concrete provider; go through garmin_health.providers.build_provider."

[tool.ruff.lint.per-file-ignores]
# The provider itself, which is the whole point of the ban.
"src/garmin_health/providers/garmindb/**" = ["TID251"]
# The selector: the one place a concrete provider is named, deliberately.
"src/garmin_health/providers/__init__.py" = ["TID251"]
# Corpus fixtures, GarminDB doubles, and the shared provider contract test.
"tests/providers/**" = ["TID251"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
packages = ["garmin_health"]
strict = true
ignore_missing_imports = true
# health-data-service ships full type annotations but no py.typed marker; without
# this mypy would treat every import from it as Any.
follow_untyped_imports = true

# GarminDB, garminconnect and dateutil are untyped. Following them would make every
# call into them a strict-mode "untyped call" error; they are Any at the boundary
# instead. health_data_service keeps follow_untyped_imports, which is why it is on.
[[tool.mypy.overrides]]
module = ["garmindb.*", "garminconnect.*", "dateutil.*", "idbutils.*", "fitfile.*"]
follow_untyped_imports = false
ignore_missing_imports = true
