[app]
name = "garmin-connector"
version = "0.1.0"
description = "Serves Garmin Connect health data over the Cloud in a Bottle health-data service"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"
# No public_paths. /setup stays behind the router's owner gate (and is guarded
# in-app by X-OpenHost-Is-Owner as well), and /v1/* is reached through the
# router's internal service proxy rather than as external browser traffic.
#
# This list and the active provider's public_routes() must match exactly, both
# ways: a route missing from here is never forwarded to, and an entry nothing
# serves is a declared door onto a 404. Both failures are silent, so
# TestManifestRoutingContract asserts it. A webhook-based provider (Terra, ROOK,
# Spike) would be the first thing to need an entry here -- its receiver is called
# by the vendor, with no owner header anywhere.
public_paths = []

[resources]
# GarminDB parses FIT files in-process; the import step is the memory peak.
memory_mb = 1024
cpu_cores = 0.5

[data]
# Holds GarminConnectConfig.json, garmin_tokens.json, the downloaded JSON/FIT
# corpus, and the GarminDB SQLite files. Losing this re-prompts for MFA and
# re-downloads years of data.
app_data = true

[[services.v2.provides]]
# Deliberately the pre-rename "imbue-openhost" string: the spec's own client
# hardcodes it as SERVICE_URL even on the cloud-in-a-bottle repo's main, and the
# router matches a provider's service string against the consumer's. Declaring the
# cloud-in-a-bottle URL here would mean no consumer ever routes to us.
service = "github.com/imbue-openhost/health-data-service-spec"
version = "0.1.0"
# The router PREPENDS this to the path the consumer asked for: "service requests
# land rooted at `endpoint` in the provider app". The spec's client requests
# "/v1/metrics", so this must be "/api/" to land on "/api/v1/metrics" -- which is
# also what the working apple-health-connector declares.
#
# "/v1/" here would land it on "/v1/v1/metrics": a 404 that the consumer reads as
# "this provider has nothing", producing a blank dashboard and no error anywhere.
endpoint = "/api/"
